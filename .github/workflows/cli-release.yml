name: Release CLI

on:
  workflow_dispatch:
  push:
    tags:
      - "cli-v*"

jobs:
  release-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release checks
        run: pnpm --filter @projectify/cli release:check

      - name: Publish to npm (restricted)
        if: startsWith(github.ref, 'refs/tags/cli-v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm --filter @projectify/cli publish --access restricted --no-git-checks

      - name: Upload release binaries
        if: startsWith(github.ref, 'refs/tags/cli-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/cli/releases/*
